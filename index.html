<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>職場英文 30 天</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFCF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFCF3; --card:#FFFFFF; --ink:#4E3A2D; --muted:#8C7564; --line:#EEDFC8;
  --butter:#FBEBAA; --caramel:#E9B872; --crust:#C98B4E; --cherry:#E8727E; --pinkwash:#FDECEA;
  --mint:#D6EBD3; --done:#7BAF73;
  --r-lg:26px; --r-md:16px; --r-sm:12px;
  --sticker:3px 3px 0 var(--ink);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* scrollbar: thin rounded caramel thumb on the cream page */
html{scrollbar-width:thin;scrollbar-color:var(--caramel) var(--bg)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--caramel);border-radius:999px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--cherry)}
::-webkit-scrollbar-button{display:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cherry);outline-offset:2px;border-radius:8px}

/* header */
.read-bar{position:absolute;left:0;bottom:-2px;height:3px;width:100%;background:var(--cherry);transform-origin:left;transform:scaleX(var(--p,0));border-radius:0 3px 3px 0;transition:transform .15s linear,opacity .3s;opacity:0}
.read-bar.on{opacity:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,252,243,.94);backdrop-filter:blur(6px);border-bottom:2px dashed var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:16px;letter-spacing:.02em;margin-right:auto}
.brand small{display:block;margin-top:3px;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;line-height:1.2}
.brand span{line-height:1.2}
.brand-mark{width:30px;height:30px;object-fit:contain;flex:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.brand{transform-origin:left center;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.brand:hover{transform:scale(1.02)}
.brand:active{transform:scale(.99)}
.brand:hover .brand-mark{transform:rotate(-5deg) scale(1.04)}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
.nav a:hover{background:var(--butter)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav svg{width:20px;height:20px}

main{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{line-height:1.3;margin:0}
h1{font-size:clamp(24px,3.6vw,32px);font-weight:900}
h2{font-size:19px;font-weight:900}
h3{font-size:16px;font-weight:700}
h1,h2,h3{text-wrap:balance}
p,.zh,.en,.lead,.ex,.mean,li{text-wrap:pretty}
p{margin:0}
.muted{color:var(--muted)}
.nw{white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--butter);border-radius:var(--r-sm);padding:10px 18px;font-weight:700;text-decoration:none;box-shadow:var(--sticker);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.pink{background:var(--cherry);color:#fff}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--butter);border-color:var(--caramel)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fav[aria-pressed="true"]{background:var(--pinkwash);border-color:var(--cherry)}
.fav[aria-pressed="true"] svg{fill:var(--cherry);stroke:var(--cherry)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;padding:36px 0 36px}
.hero h1{font-size:clamp(28px,5vw,44px);letter-spacing:.01em}
.hero p.lead{font-size:16px;margin:12px 0 22px}
@media (min-width:1000px){ .hero p.lead{white-space:nowrap} }
.hero-art{position:relative}
.hero-art svg{width:100%;max-width:300px;display:block;margin:0 auto}
.mascot-img{width:100%;max-width:190px;height:auto;display:block;margin:0 auto}
.empty .mascot-img{max-width:96px}
.today{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sticker);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.today .day-big{font-weight:900;font-size:36px;line-height:1;color:var(--cherry)}
.today .day-big small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px;line-height:1.2}
.today .meta{flex:1;min-width:180px}
.progress{margin:44px 0 8px}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin-top:10px;max-width:560px}
.dots a{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);display:block}
.dots a.ready{border-color:var(--caramel)}
.dots a.done{background:var(--done);border-color:var(--done)}
.section-title{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px;flex-wrap:wrap}
.unit-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.unit-tile{display:flex;gap:14px;align-items:center;text-decoration:none;padding:14px 16px;border-radius:var(--r-md);background:var(--card);border:2px solid var(--ink);box-shadow:var(--sticker)}
.unit-tile .no{flex:none;width:44px;font-size:28px;font-weight:900;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.unit-tile b{display:block;font-size:15px}
.unit-tile span{font-size:13px;color:var(--muted)}
.unit-tile>div{flex:1;min-width:0}
.unit-prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.unit-prog .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.unit-prog .bar i{display:block;height:100%;width:var(--w);background:var(--done);border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.unit-tile .unit-prog small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.unit-tile .unit-prog.full small{color:var(--done)}
.tips-strip{display:flex;flex-wrap:wrap;gap:10px}
.tip-chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--pinkwash);border-radius:999px;padding:6px 14px 6px 10px;font-size:14px;font-weight:500}
.tip-chip svg{width:18px;height:18px}
.tip-chip em{font-style:normal;color:var(--muted);font-size:12px}

/* syllabus */
.syl-intro{display:flex;gap:20px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.syl-intro p{max-width:34em}
.unit{border-radius:var(--r-lg);padding:22px;margin-bottom:20px;border:2px solid var(--ink)}
.unit-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.unit-head svg{width:64px;height:64px;flex:none;background:var(--card);border-radius:50%;border:2px solid var(--ink);padding:6px}
.unit-head .label{font-size:13px;font-weight:700;opacity:.75}
.days{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r-md);overflow:hidden}
.days li+li{border-top:1.5px dashed var(--line)}
.days a{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 16px;text-decoration:none}
.days a:hover{background:var(--bg)}
.days .t b{display:block;font-weight:700}
.days .t .zh{font-size:14px;color:var(--muted)}
.days .num{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.days a:hover .num{border-color:var(--caramel);color:var(--ink)}
.state{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.state.ready{background:var(--butter)}
.state.done{background:var(--done);color:#fff}
.state.reading{background:var(--mint)}
.state.soon{background:var(--bg);color:var(--muted)}

/* lesson */
.lesson-hero{position:relative;border-radius:var(--r-lg);border:2px solid var(--ink);padding:26px;display:flex;gap:22px;align-items:center;margin-bottom:12px}
.lesson-hero>svg{width:96px;height:96px;flex:none;background:var(--card);border-radius:50%;border:2px solid var(--ink);padding:10px}
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-8px 0 12px}
.lesson-nav{display:flex;gap:8px}
.lesson-nav{gap:6px}
.lesson-nav .btn.sm{padding:3px 10px;font-size:12px;gap:4px;box-shadow:2px 2px 0 var(--ink)}
.lesson-nav .btn svg{width:12px;height:12px;stroke-width:2.4}
.back-link{display:inline-flex;align-items:center;gap:4px;padding:4px 12px 4px 6px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:700;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.back-link:hover{background:var(--butter);color:var(--ink);transform:translateX(-3px)}
.back-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:14px;font-weight:700;margin-bottom:6px}
.crumb a{text-decoration:none;opacity:.75}
.crumb a:hover{opacity:1;text-decoration:underline}
.lesson-hero>div{padding-right:96px}
.lesson-hero .zh-title{font-size:16px;font-weight:500;margin-top:4px}
.scene{margin-top:10px;font-size:14px;background:rgba(255,255,255,.6);border-radius:var(--r-sm);padding:6px 12px;display:inline-block}
.block{margin-top:40px}
.block-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.step{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.block-head .sub{color:var(--muted);font-size:14px;margin-left:auto}

.chat{display:flex;flex-direction:column;gap:14px}
.line{display:flex;gap:10px;align-items:flex-end;max-width:620px}
.line.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;border:2px solid var(--ink)}
.bubble{background:var(--card);border:1.5px solid var(--line);border-radius:20px 20px 20px 6px;padding:10px 14px}
.me .bubble{background:var(--butter);border-color:var(--caramel);border-radius:20px 20px 6px 20px}
.who{font-size:12px;font-weight:700;color:var(--muted)}
.en{font-weight:500}
.bubble .zh{font-size:14px;color:var(--muted);margin-top:2px}
.line .acts{display:flex;flex-direction:column;gap:6px}
.chat-tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:4px}
.btn.sm{padding:5px 12px;font-size:13px;gap:6px;border-width:1.5px;border-radius:999px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn.sm:hover{box-shadow:3px 3px 0 var(--ink)}
.btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.done-chip{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.done-chip{background:linear-gradient(90deg,var(--mint) var(--p,0%),var(--card) var(--p,0%));font-variant-numeric:tabular-nums}
.done-chip[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.done-chip[aria-pressed="true"]:hover .lbl::after{content:"・取消"}
.done-chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.word{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.word-top{display:flex;align-items:center;gap:8px}
.word-top b{font-size:17px;font-weight:900;margin-right:auto}
.pos{font-size:13px;color:var(--crust);font-weight:700}
.word .mean{font-weight:700;margin:2px 0 6px;font-size:14px}
.word .pos{font-size:12px}
.word .ex{font-size:13.5px}
.word .ex .zh{font-size:13px}
.word .icon-btn,.phrase .icon-btn,.pattern .icon-btn,.line .icon-btn,.fav-card .icon-btn{width:32px;height:32px}
.word .icon-btn svg,.phrase .icon-btn svg,.pattern .icon-btn svg,.line .icon-btn svg,.fav-card .icon-btn svg{width:17px;height:17px}
.ex{font-size:14px;border-left:3px solid var(--butter);padding-left:10px}
.ex .zh{font-size:14px;color:var(--muted)}

.phrases{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md)}
.phrase{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.phrase+.phrase{border-top:1.5px dashed var(--line)}
.phrase .body{flex:1}
.phrase .body>b{font-size:16px;font-weight:900}
.phrase .mean{font-weight:700;font-size:14px;margin-bottom:6px}
.phrase .acts{display:flex;gap:6px}

.alts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.alts-label{font-size:12px;font-weight:700;color:var(--crust);margin-right:2px}
.alt-chip{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;transition:background .2s,border-color .2s,transform .15s cubic-bezier(.34,1.56,.64,1)}
.alt-chip .zh{font-size:12px;color:var(--muted)}
.alt-chip:hover{background:var(--butter);border-color:var(--caramel);transform:translateY(-1px)}
.alt-chip:active{transform:scale(.95)}
.minis{display:flex;flex-direction:column;gap:14px}
.mini{background:var(--card);border:1.5px dashed var(--caramel);border-radius:var(--r-lg);padding:16px 18px}
.mini h3{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:15px}
.mini h3 svg{width:20px;height:20px;flex:none;fill:var(--pinkwash);stroke:var(--cherry);stroke-width:1.8;stroke-linejoin:round}
.mini .chat{gap:10px}
.line.quiz:not(.open) .ans,.line.quiz:not(.open) .acts{display:none}
.line.quiz.open .cover{display:none}
.cover{display:flex;align-items:center;gap:22px;margin-top:2px;padding:0;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink)}
.cover b{font-size:12px;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}
.cover:hover b{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.cover:active b{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.answer-in{animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
.mini .bubble{background:var(--bg)}
.mini .me .bubble{background:var(--butter)}
.grammar{background:var(--butter);border-radius:var(--r-lg);padding:22px 24px;position:relative}
.grammar .fav{position:absolute;top:16px;right:16px}
.grammar h3{padding-right:48px;margin-bottom:8px}
.grammar .ex{border-left-color:var(--caramel);margin-top:10px;background:rgba(255,255,255,.55);border-radius:0 10px 10px 0;padding:6px 12px}

.patterns{display:flex;flex-direction:column;gap:10px}
.pattern{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.pattern .body{flex:1}
.pattern .en{font-size:15.5px}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--cherry);margin:0 2px;height:1.1em;vertical-align:-3px}
.pattern .zh{font-size:14px;color:var(--muted)}

.tipbox{background:var(--pinkwash);border:2px solid var(--cherry);border-radius:var(--r-lg);padding:22px 24px}
.tipbox-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.tipbox-head svg{width:44px;height:44px;flex:none}
.tipbox-head small{display:block;font-size:13px;font-weight:700;color:var(--cherry)}
.tipbox ol{margin:12px 0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-wrap:wrap;gap:8px}
.tipbox ol li{counter-increment:s;background:var(--card);border-radius:999px;padding:4px 14px 4px 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.tipbox ol li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--cherry);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.compare div{background:var(--card);border-radius:var(--r-sm);padding:10px 14px;font-size:15px}
.compare b{display:block;font-size:13px}
.compare .bad b{color:var(--muted)}
.compare .good b{color:var(--done)}
.tip-ex{background:var(--card);border-radius:var(--r-sm);padding:12px 16px;margin-top:6px;font-size:15px}
.tip-ex .zh{font-size:14px;color:var(--muted);margin-top:4px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.stub{text-align:center;padding:40px 20px;background:var(--card);border:2px dashed var(--line);border-radius:var(--r-lg);margin-top:28px}
.stub svg{width:140px;margin-bottom:10px}

/* method */
.method-hero{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:24px;align-items:center;padding:24px 0 20px}
.method-hero .lead{font-size:16px;margin-top:10px;max-width:34em}
.method-art .mascot-img{max-width:140px}
.routine{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--sticker);padding:16px 20px;margin-bottom:32px}
.routine b{display:block;font-size:14px;margin-bottom:10px}
.routine-bar{display:flex;gap:4px}
.routine-bar span{flex:0 0 calc(var(--w) - 4px);background:var(--butter);border-radius:8px;padding:6px 4px;text-align:center;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.routine-bar span:nth-child(1){background:var(--butter)}.routine-bar span:nth-child(2){background:var(--cherry);color:#fff}.routine-bar span:nth-child(3){background:var(--mint)}
.method-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.method-step{display:flex;gap:16px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.m-num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--cherry);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900;border:2px solid var(--ink)}
.method-step:nth-child(1) .m-num{background:var(--butter);color:var(--ink)}
.method-step:nth-child(3) .m-num{background:var(--mint);color:var(--ink)}
.m-body{flex:1;min-width:0}
.m-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-time{font-size:12px;font-weight:700;color:var(--crust);background:var(--bg);border-radius:999px;padding:1px 10px}
.m-en{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.m-why{margin:8px 0}
.m-how{margin:0 0 10px;padding-left:1.2em}
.m-how li{margin:3px 0}
.m-how li::marker{color:var(--cherry)}
.ai-prompt{margin-top:14px;background:var(--bg);border:1.5px dashed var(--caramel);border-radius:var(--r-md);padding:12px 14px}

/* favorites */
.fav-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fav-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fav-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:10px}
.fav-card .body{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--butter);margin-right:6px}
.fav-card .daylink{font-size:12px;color:var(--muted)}
.fav-card .en{white-space:pre-line;margin-top:6px}
.fav-card .zh{white-space:pre-line;font-size:14px;color:var(--muted)}
.fav-card .acts{display:flex;flex-direction:column;gap:6px}
.empty{text-align:center;padding:40px 20px;background:var(--card);border:2px dashed var(--line);border-radius:var(--r-lg)}

/* flashcards */
.modal{position:fixed;inset:0;z-index:50;background:rgba(78,58,45,.35);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.fc{width:min(520px,100%);background:var(--bg);border:2px solid var(--ink);border-radius:var(--r-lg);padding:20px;box-shadow:6px 6px 0 var(--ink)}
.fc-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fc-top .count{margin-right:auto;font-weight:700}
.card3d{perspective:1200px;cursor:pointer}
.card3d-in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.card3d.flipped .card3d-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--ink);overflow:auto}
.face.front{background:var(--card)}
.face.back{background:var(--butter);transform:rotateY(180deg)}
.face .big{font-size:20px;font-weight:900;white-space:pre-line}
.face .small{font-size:15px;white-space:pre-line;margin-top:10px;color:var(--ink)}
.face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.fc-ctrl{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

footer{max-width:1000px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- motion ---------- */
@keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:translateY(16px) scale(.96)}70%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.18,.86)}50%{transform:scale(.9,1.12)}70%{transform:scale(1.06,.95)}100%{transform:scale(1)}}
@keyframes starPop{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-15deg)}65%{transform:scale(.9) rotate(8deg)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes sprinkle{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateX(var(--from,40px)) rotate(var(--tilt,3deg))}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes navBlob{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

#app .sr:not(.in){opacity:0;transform:translateY(22px)}
#app .line.sr:not(.in){transform:translateX(-28px)}
#app .line.me.sr:not(.in){transform:translateX(28px)}
#app :is(.word,.phrase,.grammar,.pattern,.tipbox,.method-step).sr:not(.in){transform:translateY(22px) scale(.9)}
#app.page-in .reveal{opacity:0;animation:popIn .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0) * 55ms + 80ms)}
.mascot-img{animation:floaty 4s ease-in-out infinite}
.hero-art .mascot-img{filter:drop-shadow(0 14px 10px rgba(78,58,45,.12))}
.nav a{transition:background .2s,color .2s,transform .15s}
.nav a:active{transform:scale(.92)}
.nav a[aria-current="page"]{animation:navBlob .35s cubic-bezier(.34,1.56,.64,1)}
.btn{transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,background .2s}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg)}
.icon-btn{transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s}
.icon-btn:hover{transform:translateY(-2px)}
.icon-btn:active{transform:scale(.88)}
.word,.pattern,.fav-card{transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s}
.word:hover,.pattern:hover,.fav-card:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.unit-tile{transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,background .2s}
.unit-tile:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--tint,var(--card))}
.unit-tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.unit-tile:hover .no{animation:wiggle .5s ease}
.dots a{transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.dots a:hover{transform:scale(1.3)}
.fav.pop svg{animation:starPop .5s cubic-bezier(.34,1.56,.64,1)}
.icon-btn.speaking{background:var(--butter);border-color:var(--caramel)}
.icon-btn.speaking svg{animation:wiggle .45s ease-in-out infinite}
.jelly{animation:jelly .5s ease}
.sprinkle{position:fixed;z-index:60;width:8px;height:8px;border-radius:3px;pointer-events:none;animation:sprinkle .8s cubic-bezier(.2,.8,.3,1) forwards}
.modal.open .fc{animation:modalIn .35s cubic-bezier(.34,1.56,.64,1)}

  30:{
    scene:"綜合模擬：在季度檢討會上，你要報告進度、說明問題、提出方案，最後做總結。",
    cast:{Emma:"主管", Ryan:"工程師", Emily:"規劃團隊", Alex:"你"},
    dialogue:[
      ["Emma","Alex, why don't you start with the dashboard project?","Alex，不如你先從儀表板專案開始？"],
      ["Alex","Sure. Overall, we're on track. The data connection has been completed, and user testing starts next week.","好的。整體來說進度正常。資料串接已完成，使用者測試下週開始。"],
      ["Alex","One issue: the planning data is arriving late due to a system change. If it's late again, we'll miss the test date.","有一個問題：因為系統變更，規劃數據晚到了。如果再晚，我們會錯過測試日。"],
      ["Emily","Sorry about that. We're fixing it on our side.","抱歉。我們這邊正在修正。"],
      ["Alex","No problem. I'd suggest we use last month's data for the first round of testing. It's less accurate, but it keeps us on schedule.","沒關係。我建議第一輪測試先用上個月的數據。雖然沒那麼精確，但能維持進度。"],
      ["Ryan","I agree. On top of that, it gives us time to test the system itself.","我同意。而且這樣也讓我們有時間測試系統本身。"],
      ["Emma","Okay, let's go with that. Alex, can you wrap up?","好，就這麼做。Alex，可以總結一下嗎？"],
      ["Alex","To sum up, we'll test with last month's data, and Emily will send the new data by Friday. I'll send a recap email today.","總結來說，我們先用上個月的數據測試，Emily 週五前提供新數據。我今天會寄重點回顧信。"]
    ],
    words:[
      ["review","n. / v.","檢討、審查","The quarterly review is next Tuesday.","季度檢討會是下週二。"],
      ["accurate","adj.","精確的","Are these numbers accurate?","這些數字精確嗎？"],
      ["round","n.","（一）輪","The first round of testing went well.","第一輪測試很順利。"],
      ["on schedule","phr.","照進度","We're still on schedule.","我們還是照進度走。"],
      ["confident","adj.","有信心的","I'm confident we can finish on time.","我有信心能準時完成。"]
    ],
    phrases:[
      ["why don't you…","不如你…（提議）","Why don't you present first?","不如你先報告？"],
      ["on our side","我們這邊","We're working on it on our side.","我們這邊正在處理。"],
      ["wrap up","總結、收尾","Let's wrap up with next steps.","我們用後續步驟收尾。"]
    ],
    grammar:{title:"總複習：會議中最常用的四種句型",
      body:"這一課把 30 天的重點串起來：報告進度用現在完成式和被動語態（has been completed）；說明影響用 If 條件句（If it's late, we'll…）；提出方案用比較級（less accurate, but…）；總結用 To sum up + will / be going to。",
      examples:[["The data connection has been completed.","資料串接已經完成。"],["If it's late again, we'll miss the test date.","如果再晚，我們會錯過測試日。"]]},
    patterns:[
      ["Overall, we're on track. ___ has been completed.","整體來說進度正常，＿＿已經完成。"],
      ["One issue: ___. If ___, we'll ___.","有一個問題：＿＿。如果＿＿，我們會＿＿。"],
      ["To sum up, we'll ___, and ___ will ___ by ___.","總結來說，我們會＿＿，＿＿會在＿＿前＿＿。"]
    ]
  },
  1:{

/* voices: user picks a voice per role in 語音設定; otherwise auto-pick, preferring natural/online voices */
const SPEAKER_VOICE = {
  Emma:{female:true, pitch:1.05},
  Ryan:{female:false, pitch:.8},
  Alex:{female:false, pitch:1.15, alt:true},
  Emily:{female:true, pitch:1.12, alt:true},
  _:{female:true, pitch:1.0, alt:true}
};
const FEMALE = /Samantha|Allison|Ava|Susan|Victoria|Zira|Aria|Jenny|Michelle|Ana\b|Emma|Sonia|Libby|Natasha|Clara|Karen|Moira|Tessa|Fiona|Serena|Nicky|Joanna|Salli|Kimberly|Kendra|Ivy|Google US English|Google UK English Female|female/i;
const MALE = /\bAlex\b|Aaron|Fred|Tom\b|Daniel|David|Guy|Mark|Christopher|Eric|Roger|Steffan|Andrew|Brian|Ryan|Thomas|William|Arthur|Oliver|Rishi|Matthew|Justin|Joey|Google UK English Male|\bmale\b/i;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo\b|Reed|Rocko|Sandy|Shelley/i;
let VOICES=[];
const isFemale = v => FEMALE.test(v.name) && !/\bmale\b/i.test(v.name);
const isMale = v => MALE.test(v.name) && !isFemale(v);
const quality = v => (/Natural|Online|Neural|Premium|Enhanced/i.test(v.name)?2:0) + (/^en[-_]US/i.test(v.lang)?1:0);
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  VOICES = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>quality(b)-quality(a));
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceFor(who){
  const key = SPEAKER_VOICE[who]?who:"_";
  const cfg = SPEAKER_VOICE[key];
  const pool = VOICES.filter(cfg.female?isFemale:isMale);
  const list = pool.length?pool:VOICES;
  const voice = list.length ? list[(cfg.alt && list.length>1)?1:0] : null;
  // keep a per-role pitch offset so two roles sharing a similar voice still sound different
  return {voice, pitch: cfg.pitch};
}
let speakingBtn=null;
function markSpeaking(btn){
  if(speakingBtn) speakingBtn.classList.remove("speaking");
  speakingBtn=btn||null; if(btn) btn.classList.add("speaking");

const AUDIO_MAP = window.AUDIO || {};
const AUDIO_BY_TEXT = {};
Object.entries(AUDIO_MAP).forEach(([k,f])=>{ const t=k.slice(k.indexOf("|")+1); if(!(t in AUDIO_BY_TEXT)) AUDIO_BY_TEXT[t]=f; });
const audioFor = (text, who) => AUDIO_MAP[`${who}|${text}`] || AUDIO_BY_TEXT[text] || null;

function utter(text, who){
  const u = new SpeechSynthesisUtterance(text.replace(/___/g,"..."));
  const {voice,pitch} = voiceFor(who);
  u.lang = voice?voice.lang:"en-US"; u.rate=0.92; u.pitch=pitch; if(voice) u.voice=voice;
  return u;
}
/* plays one line and resolves when it ends; MP3 if we have it, otherwise the browser voice */
let player = null, playToken = 0;
function playOne(text, who, token){
  return new Promise(resolve=>{
    if(token!==playToken) return resolve();
    const tts = ()=>{
      if(!("speechSynthesis" in window) || token!==playToken) return resolve();
      const u = utter(text, who); u.onend = u.onerror = ()=>resolve(); speechSynthesis.speak(u);
    };
    const src = audioFor(text, who);
    if(!src) return tts();
    player = new Audio(src);
    let fell = false; const fallback = ()=>{ if(!fell){ fell = true; tts(); } };
    player.onended = ()=>resolve();
    player.onerror = fallback;
    player.play().catch(fallback);
  });
}
function stopSpeech(){
  playToken++;
  if(player){ player.onended = player.onerror = null; player.pause(); player = null; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
async function speakLines(lines, btn){
  stopSpeech(); const token = playToken; markSpeaking(btn);
  for(const [who,text] of lines){ await playOne(text, who, token); if(token!==playToken) return; }
  markSpeaking(null);
}
function speak(text, who, btn){ speakLines([[who,text]], btn); }

function sprinkles(el, n=14){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect(), cols=["#E8727E","#FBEBAA","#D6EBD3","#E9B872","#F9D9D6","#B9D8F0"];
  for(let i=0;i<n;i++){
    const d=document.createElement("span"); d.className="sprinkle";
    const a=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    d.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${cols[i%cols.length]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist-20}px;--rot:${Math.random()*360}deg`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),900);
  }
}

let curLesson = 0, readTick = false;
function trackRead(){
  readTick = false;
  const bar = $("#readBar");
  if(!curLesson){ bar.classList.remove("on"); return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  const pct = max<=0 ? 100 : Math.min(100, Math.round(scrollY/max*100));
  bar.classList.add("on"); bar.style.setProperty("--p", pct/100);
  const n = curLesson;
  if(pct <= (readPct[n]||0)) return;
  readPct[n] = pct; store.set("mt-read", readPct);
  const chip = $("#doneChip");
  if(pct >= 90 && !done.includes(n) && !undone.includes(n)){
    done = [...done,n]; store.set("mt-done",done);
    if(chip){ chip.setAttribute("aria-pressed","true"); chip.title="點一下取消完成"; }
    sprinkles(bar.parentElement.querySelector(".brand") || bar, 22);
  }
  if(chip){ chip.style.setProperty("--p", pct+"%"); chip.innerHTML = chipInner(n); }
}

    ${list.length?`<div class="fav-list">${list.map(f=>{ REG[f.id]=f; return `
      <div class="fav-card"><div class="body"><span class="tag">${TYPE_ZH[f.type]}</span><a class="daylink" href="#day/${f.day}">第 ${f.day} 課</a>
        <div class="en">${esc(f.en)}</div><div class="zh">${esc(f.zh)}</div>${f.note&&f.type!=="dialogue"?`<div class="zh" style="margin-top:4px">${esc(f.note)}</div>`:""}</div>
        <div class="acts">${sayBtn(f.en.replace(/^\w+: /gm,""))}${favBtn(f.id)}</div></div>`;}).join("")}</div>`
      :`<div class="empty"><p>這個類別還沒有收藏。</p></div>`}`;
}

/* ---------- flashcards ---------- */
let deck=[], idx=0;
function openFc(){
  deck = filteredFavs(); if(!deck.length) return; idx=0;
  $("#fcModal").classList.add("open"); showCard(); $("#fcCard").focus();
}
function closeFc(){ $("#fcModal").classList.remove("open"); stopSpeech(); markSpeaking(null); }
function showCard(){
  const c = deck[idx];
  $("#fcCard").classList.remove("flipped");
  replay($("#fcCard"),"slide");
  $("#fcCount").textContent = `${idx+1} / ${deck.length}　${TYPE_ZH[c.type]}`;
  $("#fcFront").textContent = c.type==="grammar" ? c.zh : c.en;
  $("#fcBack").textContent = c.type==="grammar" ? c.en : c.zh;
  $("#fcNote").textContent = c.type==="dialogue" ? "" : (c.note||"");
}
function flip(){ $("#fcCard").classList.toggle("flipped"); }
$("#fcSay").innerHTML = SPEAK;
$("#fcCard").addEventListener("click",flip);
$("#fcPrev").addEventListener("click",()=>{ $("#fcCard").style.setProperty("--from","-40px"); $("#fcCard").style.setProperty("--tilt","-3deg"); idx=(idx-1+deck.length)%deck.length; showCard(); });
$("#fcNext").addEventListener("click",()=>{ $("#fcCard").style.setProperty("--from","40px"); $("#fcCard").style.setProperty("--tilt","3deg"); idx=(idx+1)%deck.length; showCard(); });
$("#fcShuffle").addEventListener("click",()=>{ for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} idx=0; showCard(); });
$("#fcClose").addEventListener("click",closeFc);
$("#fcSay").addEventListener("click",()=>{ const c=deck[idx];
  if(c.type==="dialogue") speakLines(c.en.split("\n").map(l=>{const m=l.match(/^(\w+): (.*)$/); return m?[m[1],m[2]]:["_",l];}), $("#fcSay"));
  else speak(c.en, null, $("#fcSay")); });
$("#fcModal").addEventListener("click",e=>{ if(e.target.id==="fcModal") closeFc(); });
document.addEventListener("keydown",e=>{
  if(!$("#fcModal").classList.contains("open")) return;
  if(e.key==="Escape") closeFc();
  else if(e.key==="ArrowRight") $("#fcNext").click();
  else if(e.key==="ArrowLeft") $("#fcPrev").click();
  else if((e.key===" "||e.key==="Enter") && document.activeElement===$("#fcCard")){ e.preventDefault(); flip(); }
});

/* ---------- router & events ---------- */
/* scroll reveal on lesson pages: items fade in once as they enter the viewport and stay visible */
const SR_SEL = ".block-head,.mini h3,.line,.word,.phrase,.grammar,.pattern,.tipbox,.pager,.method-step,.method-cta";
const srObs = "IntersectionObserver" in window ? new IntersectionObserver(entries=>{
  entries.filter(e=>e.isIntersecting).forEach((e,i)=>{
    const el=e.target; srObs.unobserve(el);
    el.style.transitionDelay = (i*50)+"ms"; el.classList.add("in");
    setTimeout(()=>{ el.classList.remove("sr","in"); el.style.transitionDelay=""; }, 650+i*50);
  });
},{rootMargin:"0px 0px -8% 0px"}) : null;
function scrollReveal(){
  if(!srObs) return;
  document.querySelectorAll("#app "+SR_SEL).forEach(el=>{ el.classList.add("sr"); srObs.observe(el); });
}

function route(quiet){
  if(quiet!==true){ stopSpeech(); markSpeaking(null); } // leaving the page: stop any audio still playing
  const [page,arg] = (location.hash.slice(1)||"home").split("/");
  const app = $("#app");
  let html, nav=page;
  curLesson = 0;
  if(page==="syllabus") html=renderSyllabus(arg);
  else if(page==="day"){ const n=parseInt(arg,10)||1; html=renderLesson(n); nav="syllabus"; curLesson = LESSONS[n]?n:0; }
  else if(page==="favorites") html=renderFavs();
  else if(page==="method") html=renderMethod();
  else { html=renderHome(); nav="home"; }
  app.innerHTML = html;
  if(quiet===true) app.classList.remove("page-in"); else replay(app,"page-in");
  if(srObs) srObs.disconnect();
  if((page==="day" || page==="method") && quiet!==true) scrollReveal();
  document.querySelectorAll(".nav a").forEach(a=>a.toggleAttribute("aria-current",false));
  const cur = document.querySelector(`.nav a[data-page="${nav}"]`); if(cur) cur.setAttribute("aria-current","page");
  if(!(page==="syllabus" && arg) && quiet!==true) window.scrollTo(0,0);
  requestAnimationFrame(trackRead);
}
document.addEventListener("click",e=>{
  const f = e.target.closest("[data-fav]");
  if(f){ const id=f.dataset.fav;
    if(favs[id]) delete favs[id]; else if(REG[id]) favs[id]=REG[id];
    store.set("mt-favs",favs);
    if(location.hash.startsWith("#favorites") || id.endsWith("-dlg")) { const y=window.scrollY; route(true); window.scrollTo(0,y); }
    else { const on=!!favs[id]; f.setAttribute("aria-pressed",on); f.setAttribute("aria-label",on?"取消收藏":"加入收藏"); replay(f,"pop"); if(on) sprinkles(f,8); }
    return; }
  const cp = e.target.closest("[data-copy]");
  if(cp){ const done = ()=>{ cp.textContent="已複製！"; replay(cp,"jelly"); setTimeout(()=>cp.textContent="複製",1600); };
    navigator.clipboard ? navigator.clipboard.writeText(AI_PROMPT).then(done, ()=>{ const r=document.createRange(); r.selectNodeContents($("#aiPrompt")); getSelection().removeAllRanges(); getSelection().addRange(r); }) : null; return; }
  const rv = e.target.closest("[data-reveal]");
  if(rv){ const line = rv.closest(".line"); line.classList.add("open"); replay(line.querySelector(".bubble"),"answer-in"); sprinkles(line.querySelector(".bubble"), 10); return; }
  const s = e.target.closest("[data-say]"); if(s){ speak(s.dataset.say, s.dataset.who, s); return; }
  const sa = e.target.closest("[data-sayall]"); if(sa){ speakLines(LESSONS[sa.dataset.sayall].dialogue.map(l=>[l[0],l[1]]), sa); return; }
  const d = e.target.closest("[data-done]");
  if(d){ const n=+d.dataset.done, finishing=!done.includes(n); done = finishing?[...done,n]:done.filter(x=>x!==n); store.set("mt-done",done);
    undone = finishing?undone.filter(x=>x!==n):[...undone,n]; store.set("mt-undone",undone);
    const y=window.scrollY; route(true); window.scrollTo(0,y);
    if(finishing){ const c=document.querySelector(".done-chip"); if(c){ sprinkles(c,18); replay(c,"jelly"); } }
    return; }
  const fl = e.target.closest("[data-filter]"); if(fl){ favFilter=fl.dataset.filter; route(true); return; }
  if(e.target.closest("#startFc")) openFc();
});
window.addEventListener("hashchange",route);
$("#brandMark").src = MACARON_SRC;
route();
</script>
